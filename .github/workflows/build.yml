name: Android Build

on:
  push:
    branches: [ "claude/beginner-friendly-explanations-Ga3eq" ]
  pull_request:
    branches: [ "claude/beginner-friendly-explanations-Ga3eq" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Release APK
      env:
        BUILD_NUMBER: ${{ github.run_number }}
      run: ./gradlew assembleRelease

    - name: Rename APK
      run: |
        find app/build/outputs/apk/release -name "*.apk" | head -1 | xargs -I{} cp {} app/build/outputs/apk/release/apkupdater-m3f-durcheins.apk

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: apkupdater-m3f-durcheins
        path: app/build/outputs/apk/release/apkupdater-m3f-durcheins.apk
        retention-days: 30

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/claude/beginner-friendly-explanations-Ga3eq'
      with:
        tag_name: build-${{ github.run_number }}
        name: APK Updater M3F - Build ${{ github.run_number }}
        files: app/build/outputs/apk/release/apkupdater-m3f-durcheins.apk
        body: |
          Automatisch gebauter Release von APK Updater (DurchEins Fork)

          **Änderungen gegenüber Original:**
          - Material 3 / Material You Design
          - Nur APKMirror, GitHub und Google Play als Quellen
          - Kein Android TV Support
          - Kein Root-Install
          - Alpha-Updates immer gefiltert
          - Nur Deutsch und Englisch
          - Package: com.durcheins.apkupdater

          Commit: ${{ github.event.head_commit.message }}
        prerelease: false
